[package]
name = "overtone-wasm"
description = "wasm-bindgen surface for the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
overtone-sim.workspace = true
overtone-rl = { path = "../overtone-rl" }
overtone-spec = { path = "../overtone-spec" }
overtone-lie.workspace = true
overtone-gsim.workspace = true
rand.workspace = true
rand_chacha.workspace = true
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
