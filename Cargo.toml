[workspace]
resolver = "2"
members = [
    "crates/overtone-sim",
    "crates/overtone-rl",
    "crates/overtone-spec",
    "crates/overtone-lie",
    "crates/overtone-gsim",
    "crates/overtone-mps",
    "crates/overtone-walk",
    "crates/overtone-wfc",
    "crates/overtone-graph",
    "crates/overtone-qd",
    "crates/overtone-opt",
    "crates/overtone-orbit",
    "crates/overtone-cgt",
    "crates/overtone-otn",
    "crates/overtone-cli",
    "crates/overtone-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/overtone-qrl/overtone"

[workspace.dependencies]
overtone-sim = { path = "crates/overtone-sim" }
overtone-rl = { path = "crates/overtone-rl" }
overtone-spec = { path = "crates/overtone-spec" }
overtone-lie = { path = "crates/overtone-lie" }
overtone-gsim = { path = "crates/overtone-gsim" }
overtone-mps = { path = "crates/overtone-mps" }
overtone-walk = { path = "crates/overtone-walk" }
overtone-wfc = { path = "crates/overtone-wfc" }
overtone-qd = { path = "crates/overtone-qd" }
overtone-graph = { path = "crates/overtone-graph" }
overtone-opt = { path = "crates/overtone-opt" }
overtone-orbit = { path = "crates/overtone-orbit" }
overtone-cgt = { path = "crates/overtone-cgt" }
overtone-otn = { path = "crates/overtone-otn" }
# No entropy source, deliberately: every random draw in this workspace is seeded
# explicitly (Part I 5, determinism). Dropping default features removes the getrandom
# dependency entirely, which both enforces that invariant and lets the core crates build
# for wasm32-unknown-unknown without a "js" shim.
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
