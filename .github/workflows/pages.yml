name: pages

# Mirror of the Hugging Face Static Space, so neither host is a single point of failure
# (Part IV 1). Both serve the same bytes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build wasm
        run: |
          wasm-pack build crates/overtone-wasm --target web --out-dir pkg --release
          mkdir -p web/pkg
          cp crates/overtone-wasm/pkg/overtone_wasm.js \
             crates/overtone-wasm/pkg/overtone_wasm_bg.wasm web/pkg/

      - name: JS budget
        run: ./scripts/check_js_budget.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
