name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (parallel feature)
        run: cargo clippy -p overtone-sim --features parallel --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (parallel feature)
        run: cargo test -p overtone-sim --features parallel

      # The demo ships as WASM with no backend (Part I 3, Part IV 1), so the core crate
      # must keep building for wasm32. It has no entropy dependency, deliberately, which
      # is what lets this pass without a getrandom shim.
      - name: Build for wasm32
        run: |
          cargo build -p overtone-sim --target wasm32-unknown-unknown
          # overtone-rl too: the LP ceiling is drawn behind the learning curve in the
          # browser, so good_lp must stay on a pure-Rust backend.
          cargo build -p overtone-rl --target wasm32-unknown-unknown
          cargo build -p overtone-spec --target wasm32-unknown-unknown
          # Part III's Closure chapter runs in the browser too: the closure engine and
          # g-sim both have to cross to wasm32.
          cargo build -p overtone-lie --target wasm32-unknown-unknown
          cargo build -p overtone-gsim --target wasm32-unknown-unknown

      - name: JS budget
        run: ./scripts/check_js_budget.sh

      # Part III's numbers are measurements, not unit tests, and they are slow in debug.
      # Each of these backs a sentence in the README.
      - name: Theorem 1 reproduces at depth 64
        run: |
          cargo run --release -q -p overtone-gsim --example theorem_one | tee /tmp/t1.txt
          grep -qE '^ 7 +91 +1 +0\.065934 +64 +0\.0(6[5-9]|7[0-2])' /tmp/t1.txt

      - name: A hundred-qubit policy trains
        run: |
          cargo run --release -q -p overtone-gsim --example hundred_qubit_policy | tee /tmp/hq.txt
          grep -qE 'return after +\+0\.2[0-9]' /tmp/hq.txt

      - name: The dequantization verdict is published whatever it says
        run: |
          cargo run --release -q -p overtone-cli -- dequantize --qubits 4 --layers 3 \
            --k 3 --tolerance 1e-6 --max-chi 8 | tee /tmp/dq.txt
          grep -q 'effective chi = 3' /tmp/dq.txt

      - name: predict refuses the claim it cannot support
        run: |
          cargo run --release -q -p overtone-cli -- predict --qubits 4 --layers 2 \
            | grep -q 'No trainability claim follows'

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Part I 5. Bit-exactness holds within a target but not across them: IEEE-754 does
      # not require correctly-rounded transcendentals, and native libm disagrees with
      # wasm32's by one ULP on roughly 5% of sin/cos evaluations. See the script.
      - name: Native versus wasm agreement
        run: ./scripts/wasm_determinism.sh

      - name: Build the page
        run: |
          wasm-pack build crates/overtone-wasm --target web --out-dir pkg --release
          mkdir -p web/pkg
          cp crates/overtone-wasm/pkg/overtone_wasm.js \
             crates/overtone-wasm/pkg/overtone_wasm_bg.wasm web/pkg/

      # The page must boot and populate its readouts from the real engine. A page that
      # loads but shows placeholders is the failure mode this catches.
      - name: Smoke test in a headless browser
        run: |
          (cd web && python3 -m http.server 8731 &)
          sleep 3
          google-chrome --headless --disable-gpu --no-sandbox \
            --virtual-time-budget=12000 --dump-dom http://localhost:8731/index.html > dom.html
          grep -q 'id="loading"' dom.html && { echo "engine failed to boot"; exit 1; }
          grep -qE '<b id="r-ceiling">[0-9]+</b>' dom.html || { echo "readouts not populated"; exit 1; }
          grep -qE '<b id="hero-lambda">[0-9]' dom.html || { echo "hero did not run"; exit 1; }
          grep -qE '<b id="cl-dim">28</b>' dom.html || { echo "closure did not run"; exit 1; }
          grep -qE '<b id="cl-var">0\.1071</b>' dom.html || { echo "prediction not rendered"; exit 1; }
          echo "page booted and populated from the engine"

  oracle:
    name: yao oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2

      - name: Generate cases from the Rust engine
        run: cargo run -q -p overtone-sim --example emit_oracle_cases > lab/test/cases.txt

      - name: Install Yao.jl
        run: julia --project=lab -e 'using Pkg; Pkg.instantiate()'

      # Part I 9: "Gradients match Yao.jl to 1e-12", enforced here rather than asserted
      # in prose.
      - name: Differential test against Yao.jl
        run: julia --project=lab lab/test/oracle.jl
